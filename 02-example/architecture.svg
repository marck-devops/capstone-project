<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 960" width="1280" height="960" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#232f3e"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
  </defs>

  <rect width="1280" height="960" fill="#ffffff"/>

  <!-- Title -->
  <text x="40" y="44" font-size="24" font-weight="bold" fill="#232f3e">Example 02 – network and compute stacks</text>
  <text x="40" y="68" font-size="14" fill="#4b5563">project_name = capstone-ex02 · two Terraform root modules, each with its own state</text>

  <!-- User / Internet -->
  <rect x="540" y="86" width="200" height="52" rx="8" fill="#f3f4f6" stroke="#232f3e" stroke-width="1.5"/>
  <text x="640" y="108" font-size="15" font-weight="bold" text-anchor="middle" fill="#232f3e">User / Internet</text>
  <text x="640" y="127" font-size="12" text-anchor="middle" fill="#4b5563">browser · curl · ssh</text>

  <!-- Region -->
  <rect x="40" y="150" width="1200" height="660" rx="6" fill="none" stroke="#147eba" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="54" y="170" font-size="13" font-weight="bold" fill="#147eba">AWS Region us-east-2</text>

  <!-- VPC -->
  <rect x="70" y="190" width="1140" height="600" rx="6" fill="none" stroke="#248814" stroke-width="2"/>
  <text x="84" y="212" font-size="13" font-weight="bold" fill="#248814">VPC capstone-ex02-vpc · 10.20.0.0/16</text>

  <!-- AZ a -->
  <rect x="100" y="250" width="520" height="520" rx="6" fill="none" stroke="#6b7280" stroke-dasharray="4 4"/>
  <text x="114" y="270" font-size="13" font-weight="bold" fill="#4b5563">Availability Zone A (subnet_index = 0)</text>

  <!-- AZ b -->
  <rect x="660" y="250" width="520" height="520" rx="6" fill="none" stroke="#6b7280" stroke-dasharray="4 4"/>
  <text x="674" y="270" font-size="13" font-weight="bold" fill="#4b5563">Availability Zone B</text>

  <!-- Public subnet A -->
  <rect x="115" y="282" width="490" height="226" rx="4" fill="#e9f5e6" stroke="#248814"/>
  <text x="127" y="300" font-size="12" font-weight="bold" fill="#248814">Public subnet 1 · 10.20.1.0/24 · Tier = public</text>
  <text x="127" y="498" font-size="11" fill="#248814">public-rt: 0.0.0.0/0 → IGW</text>

  <!-- Private subnet A -->
  <rect x="115" y="528" width="490" height="228" rx="4" fill="#e6f0fa" stroke="#147eba"/>
  <text x="127" y="546" font-size="12" font-weight="bold" fill="#147eba">Private subnet 1 · 10.20.10.0/24 · Tier = private</text>
  <text x="127" y="746" font-size="11" fill="#147eba">private-rt: 0.0.0.0/0 → NAT gateway</text>

  <!-- Public subnet B -->
  <rect x="675" y="282" width="490" height="226" rx="4" fill="#e9f5e6" stroke="#248814"/>
  <text x="687" y="300" font-size="12" font-weight="bold" fill="#248814">Public subnet 2 · 10.20.2.0/24 · Tier = public</text>
  <text x="920" y="400" font-size="12" text-anchor="middle" fill="#6b7280">no instances (available via subnet_index = 1)</text>
  <text x="687" y="498" font-size="11" fill="#248814">public-rt: 0.0.0.0/0 → IGW</text>

  <!-- Private subnet B -->
  <rect x="675" y="528" width="490" height="228" rx="4" fill="#e6f0fa" stroke="#147eba"/>
  <text x="687" y="546" font-size="12" font-weight="bold" fill="#147eba">Private subnet 2 · 10.20.20.0/24 · Tier = private</text>
  <text x="920" y="645" font-size="12" text-anchor="middle" fill="#6b7280">no instances (available via subnet_index = 1)</text>
  <text x="687" y="746" font-size="11" fill="#147eba">private-rt: 0.0.0.0/0 → NAT gateway</text>

  <!-- IGW (on VPC border) -->
  <rect x="580" y="172" width="120" height="40" rx="6" fill="#8c4fff" stroke="#5b21b6"/>
  <text x="640" y="190" font-size="12" font-weight="bold" text-anchor="middle" fill="#ffffff">Internet Gateway</text>
  <text x="640" y="205" font-size="10" text-anchor="middle" fill="#ede9fe">capstone-ex02-igw</text>

  <!-- NAT gateway -->
  <rect x="135" y="330" width="170" height="92" rx="6" fill="#8c4fff" stroke="#5b21b6"/>
  <text x="220" y="356" font-size="13" font-weight="bold" text-anchor="middle" fill="#ffffff">NAT Gateway</text>
  <text x="220" y="376" font-size="11" text-anchor="middle" fill="#ede9fe">+ Elastic IP</text>
  <text x="220" y="394" font-size="10" text-anchor="middle" fill="#ede9fe">capstone-ex02-nat-gateway</text>
  <text x="220" y="410" font-size="10" text-anchor="middle" fill="#ede9fe">outbound only</text>

  <!-- Web SG + instance -->
  <rect x="345" y="314" width="245" height="170" rx="6" fill="none" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="355" y="330" font-size="11" font-weight="bold" fill="#dd344c">capstone-ex02-web-sg</text>
  <text x="355" y="344" font-size="10" fill="#dd344c">in: 22 (allowed_ssh_cidr) · 80 · 8000 (0.0.0.0/0)</text>
  <rect x="360" y="352" width="215" height="120" rx="6" fill="#ff9900" stroke="#b45309"/>
  <text x="467" y="372" font-size="13" font-weight="bold" text-anchor="middle" fill="#232f3e">EC2 · capstone-ex02-web</text>
  <text x="467" y="389" font-size="11" text-anchor="middle" fill="#232f3e">t3.micro · AL2023 · public IP</text>
  <rect x="372" y="398" width="191" height="64" rx="4" fill="#fff7ed" stroke="#b45309"/>
  <text x="467" y="415" font-size="11" text-anchor="middle" fill="#232f3e">nginx :80  →  proxy</text>
  <text x="467" y="432" font-size="11" text-anchor="middle" fill="#232f3e">redis_check.py :8000</text>
  <text x="467" y="449" font-size="10" text-anchor="middle" fill="#6b7280">systemd: redis-check.service</text>

  <!-- Redis SG + instance -->
  <rect x="345" y="566" width="245" height="160" rx="6" fill="none" stroke="#dd344c" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="355" y="582" font-size="11" font-weight="bold" fill="#dd344c">capstone-ex02-redis-sg</text>
  <text x="355" y="596" font-size="10" fill="#dd344c">in: 6379 · 22 (source: web-sg only)</text>
  <rect x="360" y="606" width="215" height="108" rx="6" fill="#ff9900" stroke="#b45309"/>
  <text x="467" y="628" font-size="13" font-weight="bold" text-anchor="middle" fill="#232f3e">EC2 · capstone-ex02-redis</text>
  <text x="467" y="646" font-size="11" text-anchor="middle" fill="#232f3e">t3.micro · AL2023 · no public IP</text>
  <rect x="372" y="656" width="191" height="46" rx="4" fill="#fff7ed" stroke="#b45309"/>
  <text x="467" y="675" font-size="11" text-anchor="middle" fill="#232f3e">redis6 :6379</text>
  <text x="467" y="692" font-size="10" text-anchor="middle" fill="#6b7280">bind 0.0.0.0 · protected-mode no</text>

  <!-- Arrows -->
  <!-- User -> IGW -->
  <line x1="640" y1="138" x2="640" y2="170" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="652" y="160" font-size="11" fill="#232f3e">HTTP :80 · app :8000 · SSH :22</text>

  <!-- IGW -> Web -->
  <path d="M640,212 V400 H592" fill="none" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Web -> Redis -->
  <line x1="467" y1="484" x2="467" y2="564" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="474" y="514" width="128" height="34" fill="#ffffff" opacity="0.9"/>
  <text x="478" y="528" font-size="11" fill="#232f3e">TCP 6379 (redis-py)</text>
  <text x="478" y="543" font-size="11" fill="#232f3e">SSH 22 (jump host)</text>

  <!-- Redis -> NAT (outbound) -->
  <path d="M345,690 H220 V424" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-grey)"/>
  <text x="228" y="610" font-size="11" fill="#4b5563">outbound only</text>
  <text x="228" y="625" font-size="11" fill="#4b5563">(dnf install redis6)</text>

  <!-- NAT -> IGW -->
  <path d="M220,330 V230 H578" fill="none" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-grey)"/>

  <!-- Legend -->
  <text x="40" y="842" font-size="14" font-weight="bold" fill="#232f3e">Stacks</text>

  <rect x="40" y="856" width="16" height="16" rx="3" fill="#8c4fff"/>
  <rect x="62" y="856" width="16" height="16" rx="3" fill="#e9f5e6" stroke="#248814"/>
  <rect x="84" y="856" width="16" height="16" rx="3" fill="#e6f0fa" stroke="#147eba"/>
  <text x="108" y="869" font-size="12" fill="#232f3e"><tspan font-weight="bold">network/</tspan> – VPC, IGW, public + private subnets, route tables, NAT gateway + EIP</text>

  <rect x="40" y="882" width="16" height="16" rx="3" fill="#ff9900"/>
  <rect x="62" y="882" width="16" height="16" rx="3" fill="none" stroke="#dd344c" stroke-dasharray="3 2"/>
  <text x="108" y="895" font-size="12" fill="#232f3e"><tspan font-weight="bold">compute/</tspan> – web + redis security groups, EC2 instances, ED25519 key pair (capstone-ex02-key, .pem written locally)</text>

  <text x="40" y="928" font-size="12" fill="#4b5563">compute/ finds the network by tags (Name, Project, Tier) – no terraform_remote_state. Apply network/ first, destroy it last.</text>

  <line x1="760" y1="838" x2="800" y2="838" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="808" y="842" font-size="12" fill="#232f3e">inbound traffic</text>
  <line x1="940" y1="838" x2="980" y2="838" stroke="#6b7280" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-grey)"/>
  <text x="988" y="842" font-size="12" fill="#232f3e">outbound via NAT</text>
</svg>
